
<div class="flex h-screen w-full bg-slate-50 overflow-hidden">
  
  <aside class="w-[33%] min-w-[280px] max-w-[380px] shrink-0 border-r border-slate-200 h-full">
    <app-sidebar
      (categorySelected)="onCategorySelected($event)"
      class="block h-full"
    ></app-sidebar>
  </aside>

  <main class="min-w-0 flex-1 h-full overflow-hidden">
    <app-task-list 
      [categoryId]="selectedCategoryId()" 
      class="block h-full"
    ></app-task-list>
  </main>
  
</div>
